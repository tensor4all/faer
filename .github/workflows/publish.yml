name: publish

# Operator-triggered release: a human pushes a `v*` tag, or runs this workflow
# by hand. The publish commands need a CRATES_IO_API_TOKEN secret.
#
# A `dry-run-only` dispatch does not upload, so it can only preflight a crate
# whose dependencies already exist on the registry. It cannot validate the very
# first publication of `t4a-faer-traits` together with `t4a-faer`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run-only:
        description: "Run the publish commands in dry-run mode (no upload)"
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry run t4a-faer-traits
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only }}
        run: cargo publish -p t4a-faer-traits --dry-run

      - name: Dry run t4a-faer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only }}
        run: cargo publish -p t4a-faer --dry-run

      # `cargo publish` waits for the upload it just made to reach the index, so
      # the second publish resolves the version the first one pushed.
      - name: Publish t4a-faer-traits
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run-only) }}
        run: cargo publish -p t4a-faer-traits --token "${{ secrets.CRATES_IO_API_TOKEN }}"

      - name: Publish t4a-faer
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry-run-only) }}
        run: cargo publish -p t4a-faer --token "${{ secrets.CRATES_IO_API_TOKEN }}"
