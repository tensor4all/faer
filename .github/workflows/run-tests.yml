on:
  push:
    branches:
      - main
      - refactor-3
  pull_request:

name: Run Tests

jobs:
  msrv:
    name: msrv-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.89.0
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@master

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: MSRV 1.89.0
        run:
          cd ./faer-traits &&
          cargo check &&
          cd ../faer &&
          cargo check

  # The nightly pin is the oldest one that carries the Rust 1.89 stabilisations (`rust-version` in
  # the manifests is 1.89, and the AVX-512 target features the `x86-v4` feature needs are stable
  # there); 2025-08-07 is the 1.89 release date.
  nostd:
    name: nostd-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - nightly-2025-08-07
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@master

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: nostd
        run:
          cd ./faer-no-std-test &&
          cargo run --profile nostd

  testing:
    name: testing-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@master

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install latest nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install OpenBLAS by apt
        run: |
          sudo apt update
          sudo apt install -y libopenblas-dev liblapack-dev
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Collect coverage data
        run: cd faer && cargo llvm-cov nextest --features=unstable --lcov --output-path ../lcov.info

      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
