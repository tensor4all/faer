name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The designated lightweight gate: build both crates and test the light
      # one. The inherited upstream workflows (`run-tests.yml`,
      # `code-quality.yml`) also run on these events with the heavier upstream
      # suite.
      - run: cargo build -p t4a-faer-traits -p t4a-faer
      - run: cargo build -p t4a-faer --no-default-features --features std
      - run: cargo test -p t4a-faer-traits
      - run: cargo package -p t4a-faer-traits -p t4a-faer --no-verify --list
