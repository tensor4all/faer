name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The fork gate is a build plus the one light crate's tests. faer's own
      # test dependencies (openssl-sys vendored, curl/tar, nalgebra, ...) are
      # heavy, so the full upstream suite is run locally, not here.
      - run: cargo build -p t4a-faer-traits -p t4a-faer
      - run: cargo build -p t4a-faer --no-default-features --features std
      - run: cargo test -p t4a-faer-traits
      - run: cargo package -p t4a-faer-traits -p t4a-faer --no-verify --list
