on:
  push:
    branches:
      - dev
      - main
  pull_request:

name: Assess Code Quality

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@master

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Same version as rust-toolchain.toml, which is what cargo runs here anyway.
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Formatting check
        run:
          cargo fmt --all -- --check &&
          cd ./faer-entity &&
          cargo fmt --all -- --check
        # want to get all quality issues
        continue-on-error: true

      - name: Lint (clean crates only, blocking)
        run: cargo clippy -p t4a-faer-traits --all-targets -- -D warnings

        # t4a-faer: 2340 warnings on 1.96.0, measured 2026-11-07. Not a gate -- the number is a
        # floor someone measured, not an assumption. A crate that reaches zero graduates into the
        # blocking step above.
      - name: Linting check
        run:
          cargo clippy --all-targets &&
          cd ./faer-entity &&
          cargo clippy --all-targets
        continue-on-error: true
