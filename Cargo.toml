[workspace]
members = [
  "faer-traits",
  "faer",
  "faer-macros",
]
# faer-ffi carries the C API and its cbindgen build; tensor4all does not consume
# it, so the fork excludes it instead of keeping it in the workspace build.
exclude = [
  "faer-no-std-test",
  "eigen-bench-setup",
  "faer-ffi",
]

resolver = "2"

[workspace.package]
description = "Dense and sparse linear algebra for HPC applications with caller owned thread teams."
keywords = ["linear-algebra", "matrix", "hpc", "multithreading", "tensor"]
categories = ["mathematics", "science", "concurrency"]
documentation = "https://docs.rs/t4a-faer"

[profile.dev]
opt-level = 3
lto = "off"
