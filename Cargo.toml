[workspace]
members = [
  "faer-traits",
  "faer",
  "faer-macros",
]
# faer-ffi carries the C API and its cbindgen build; tensor4all does not consume
# it, so the fork excludes it instead of keeping it in the workspace build.
exclude = [
  "faer-no-std-test",
  "eigen-bench-setup",
  "faer-ffi",
]

resolver = "2"

[profile.dev]
opt-level = 3
lto = "off"

# Probe only (not for merge): threadteam with the staged waits (tensor4all/threadteam-rs
# branch feat/own-threads), for the faer#107 before/after comparison.
[patch.crates-io]
threadteam = { git = "https://github.com/tensor4all/threadteam-rs", rev = "0e259b5ad503d242c6b4804966d01b1cffecff7b" }
