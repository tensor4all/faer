[workspace]
members = [
  "faer-traits",
  "faer",
  "faer-macros",
  "faer-ffi",
]
# faer-ffi carries the C API and its cbindgen build. Its `Par` boundary is a
# caller-owned team handle, so it builds again (tensor4all/faer#98).
exclude = [
  "faer-no-std-test",
  "eigen-bench-setup",
]

resolver = "2"

[workspace.package]
description = "Dense and sparse linear algebra for HPC applications with caller owned thread teams."
keywords = ["linear-algebra", "matrix", "hpc", "multithreading", "tensor"]
categories = ["mathematics", "science", "concurrency"]
documentation = "https://docs.rs/t4a-faer"

[profile.dev]
opt-level = 3
lto = "off"
